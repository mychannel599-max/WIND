<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I’m Sorry ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #000;
}

/* Soft background image */
.background {
    position: fixed;
    inset: 0;
    background: url("bg.jpg") center / cover no-repeat;
    filter: brightness(0.6) blur(1px);
    z-index: -2;
}

/* Overlay to reduce highlight */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 200, 210, 0.35);
    z-index: -1;
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.92);
    padding: 26px 22px;
    border-radius: 22px;
    width: 90%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 18px 35px rgba(0,0,0,0.35);
    animation: pop 0.6s ease;
}

@keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

h1 {
    color: #ff4d6d;
    font-size: 26px;
}

p {
    font-size: 15.5px;
    line-height: 1.6;
    color: #444;
}

/* Buttons */
button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    font-weight: 600;
}

#forgive {
    background: #ff4d6d;
    color: white;
}

/* Calm angry button */
#angry {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 280px;
    background: #eee;
    transition: transform 0.35s ease;
}

.hidden {
    display: none;
}

/* Flower animation */
.flower {
    position: fixed;
    font-size: 22px;
    animation: floatUp 5s linear forwards;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-160px); opacity: 0; }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<!-- AUDIO -->
<audio id="sorryMusic" src="sorry.mp3" loop></audio>
<audio id="thankMusic" src="thankyou.mp3" loop></audio>

<!-- APOLOGY CARD -->
<div class="card" id="mainCard">
    <h1>Hey STEWIE ❤️</h1>
    <p>
        I know I didn’t talk to you properly today.  
        I made you wait and acted immature 😔<br><br>

        I never meant to hurt you.  
        You matter to me more than you know.<br><br>

        Please forgive your idiot 🥺
    </p>

    <button id="forgive" onclick="forgiveMe()">I Forgive You 💕</button>
</div>

<button id="angry" ontouchstart="moveButton()" onclick="moveButton()">
I’m Still Angry 😤
</button>

<!-- THANK YOU CARD -->
<div class="card hidden" id="forgivenCard">
    <h1>Thank You 🥹🌸</h1>
    <p>
        I promise to be better.<br>
        Softer. Kinder. More present.<br><br>
        Thank you for staying 🫶
    </p>
</div>

<script>
const sorryMusic = document.getElementById("sorryMusic");
const thankMusic = document.getElementById("thankMusic");

document.body.addEventListener("click", () => {
    if (sorryMusic.paused) sorryMusic.play();
}, { once: true });

let moveCount = 0;
function moveButton() {
    const btn = document.getElementById("angry");
    moveCount++;
    btn.style.transform = moveCount % 2
        ? "translate(-50%, -60px)"
        : "translate(-50%, 0)";
}

function forgiveMe() {
    document.getElementById("mainCard").classList.add("hidden");
    document.getElementById("angry").classList.add("hidden");
    document.getElementById("forgivenCard").classList.remove("hidden");

    sorryMusic.pause();
    thankMusic.play();

    flowerRain();
}

function flowerRain() {
    for (let i = 0; i < 20; i++) {
        setTimeout(() => {
            const f = document.createElement("div");
            f.className = "flower";
            f.innerText = "🌸";
            f.style.left = Math.random() * window.innerWidth + "px";
            f.style.bottom = "20px";
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 5000);
        }, i * 200);
    }
}
</script>

</body>
</html>
